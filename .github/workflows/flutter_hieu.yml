name: Flutter Hieu CI

on:
  push:
    branches:
      - hieu
  pull_request:
    branches:
      - hieu
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Cloud-only data guard
        run: python3 tool/verify_cloud_only.py

      - name: Format game code
        run: >-
          dart format
          lib/core/repositories/progress_repository.dart
          lib/core/services/tts_service.dart
          lib/screen/unit_path
          lib/screen/boss_battle
          lib/screen/duolingo
          lib/screen/game_hub/game_hub_screen.dart
          test/screen/boss_battle

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Boss Battle tests
        run: flutter test test/screen/boss_battle

      - name: Build optimized release APKs
        run: flutter build apk --release --split-per-abi

      - name: Report release APK sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('build/app/outputs/flutter-apk').glob('app-*-release.apk'))
          if not files:
              raise SystemExit('No split release APKs were produced')
          for p in files:
              size = p.stat().st_size
              print(f'{p.name}: {size:,} bytes ({size / 1024 / 1024:.2f} MiB)')
          PY

      - name: Upload optimized release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-hieu-release-split
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7
