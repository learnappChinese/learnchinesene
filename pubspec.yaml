name: pandarin
description: "A cloud-first HSK Chinese learning app powered by Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  flutter_keyboard_visibility: ^6.0.0
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  audioplayers: ^6.7.1
  speech_to_text: ^7.4.0
  permission_handler: ^11.3.1
  path_drawing: ^1.0.1
  image_picker: ^1.1.2
  flutter_tts: ^4.1.0
  supabase_flutter: ^2.0.0
  shared_preferences: ^2.5.5
  rive: ^0.14.11
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4
  fsrs: ^2.0.1
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  icons_launcher: ^3.0.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo.png
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/images/effects/
    - assets/images/foods/
    - assets/rive/
    - assets/data/

  fonts:
    - family: PinyinFont
      fonts:
        - asset: assets/fonts/Pinyinfont_V2.ttf
    - family: FZKaiTiPinyin
      fonts:
        - asset: assets/fonts/fz_kaiti_pinyin_01.ttf
    - family: FZKaiTiPinyin_1
      fonts:
        - asset: assets/fonts/fz_kaiti_pinyin_01.ttf
    - family: PinyinOk
      fonts:
        - asset: assets/fonts/fz_kaiti_pinyin_01.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
